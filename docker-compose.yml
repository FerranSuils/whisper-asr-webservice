version: "3.4"

services:
  whisper-asr-webservice:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASR_MODEL=base
      - MAX_FILE_SIZE=0  # 0 = unlimited file size
      - ASR_QUANTIZATION=float32  # Explicitly use FP32 on CPU to avoid FP16 warning
    ports:
      - "9000:9000"
    volumes:
      - ./app:/app/app
      - cache-whisper:/root/.cache
    # DNS configuration to resolve download issues
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # Resource limits to prevent OOM issues
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    # Restart policy to handle unexpected crashes
    restart: unless-stopped

volumes:
  cache-whisper:
